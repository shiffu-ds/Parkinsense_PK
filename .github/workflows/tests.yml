name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: uv python install 3.11
      - run: uv sync --locked --group dev --group mcp
      - run: uv run --group dev --group mcp ruff check .
      - run: uv run --group dev --group mcp pytest -q

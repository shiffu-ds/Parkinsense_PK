plugins { id 'com.android.application' }

android {
    namespace 'org.parkinsense.pk'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.parkinsense.pk'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [allowLanHttp: 'false']
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-local'; manifestPlaceholders = [allowLanHttp: 'true'] }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.2'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    testImplementation 'junit:junit:4.13.2'
}
